# Render Blueprint: one Ruby web service. The database is NOT here — it lives
# on Supabase; paste its *session pooler* connection string into DATABASE_URL
# (see README, «Deploy»). Values marked sync: false are asked for once in the
# Render dashboard and never stored in the repo. The region matches the
# Supabase database (Frankfurt) and cannot be changed once the service exists.
services:
  - type: web
    name: rateflow-forecast
    region: frankfurt
    runtime: ruby
    plan: free
    buildCommand: bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CRON_TOKEN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAILS_ENV
        value: production
      # Keeps the Active Record pool equal to Puma's thread count so the app
      # never wants more connections than Supabase's free tier comfortably gives.
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: TZ
        value: Europe/Moscow
